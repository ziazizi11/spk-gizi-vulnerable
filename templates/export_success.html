<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Laporan Berhasil - SPK Gizi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --primary-light: #d1fae5;
            --secondary: #0284c7;
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #f0f9ff 50%, #f8fafc 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 0 0 50px;
            line-height: 1.6;
        }

        .navbar {
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 14px 24px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--primary);
            text-decoration: none;
        }

        .container {
            max-width: 600px;
            margin: 60px auto 0;
            padding: 0 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .icon-circle {
            width: 72px;
            height: 72px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 20px;
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .notes-preview {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            font-size: 0.95rem;
            text-align: left;
            margin-bottom: 28px;
            color: #334155;
            border-left: 4px solid var(--primary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
            color: #ffffff;
        }

        .btn-outline {
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            color: #334155;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="brand">
                <span>🥗</span> NutriDecision SPK
            </a>
            <a href="/" style="text-decoration: none; font-weight: 600; color: #475569; font-size: 0.9rem;">Beranda</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="icon-circle">✓</div>
            <h2>Laporan Berhasil Diarsipkan</h2>
            <p>Catatan rekomendasi gizi dan riwayat analisis telah berhasil disimpan ke log sistem.</p>

            {% if notes %}
            <div class="notes-preview">
                <span style="font-size: 0.8rem; font-weight: 700; color: #64748b; display: block; margin-bottom: 4px;">Catatan Pengguna:</span>
                "{{ notes }}"
            </div>
            {% endif %}

            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <a href="/" class="btn btn-outline">⬅️ Kembali ke Beranda</a>
                <a href="/spk/saw" class="btn btn-primary">📊 Cek Ranking SAW</a>
            </div>
        </div>
    </div>
</body>
</html>
